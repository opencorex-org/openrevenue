name: Developer environment

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: developer-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  developer-environment:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    name: Reproducible environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate shell scripts
        run: bash -n scripts/dev/*.sh scripts/ci/*.sh
      - name: Validate pinned configuration and safe examples
        run: make validate-config
      - name: Validate workflow policy
        run: bash scripts/ci/validate-workflows.sh
      - name: Validate Docker Compose model
        run: docker compose --env-file .env.example config --quiet
      - name: Demonstrate idempotent bootstrap
        run: |
          make bootstrap
          make bootstrap
