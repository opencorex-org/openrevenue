name: Contracts CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    name: Contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact contract tooling
        run: pnpm install --frozen-lockfile
      - name: Validate OpenAPI and event JSON Schemas
        run: make contracts
      - name: Detect breaking contract changes
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm contracts:compat
